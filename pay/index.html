<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VYBORA · Recharge du portefeuille</title>
<!--
  Static payment page, to host at https://vybora.com/pay/ (Supabase Edge
  Functions do not serve HTML). The app opens:
    https://vybora.com/pay/?deposit=<deposit id>&amount=<FCFA>&key=<KKIAPAY public key>&sandbox=1
  The deposit id is sent to KKIAPAY as partnerId; the server only credits the
  wallet after checking the transaction with KKIAPAY's API (webhook + app).
-->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07080F;
         color: #F2F4FF; font-family: Inter, system-ui, sans-serif; }
  main { width: min(420px, 90vw); padding: 32px; border-radius: 24px; background: rgba(20,24,48,.7);
         border: 1px solid rgba(255,255,255,.1); text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #C9CEE8; line-height: 1.5; }
  .amount { font-size: 34px; font-weight: 700; margin: 16px 0; }
  button, a.btn { display: inline-block; width: 100%; box-sizing: border-box; height: 52px; border: 0; border-radius: 16px;
         background: linear-gradient(135deg,#7C5CFF,#5B8CFF 60%,#22D3EE); color: #07080F; font-size: 15px;
         font-weight: 600; cursor: pointer; text-decoration: none; line-height: 52px; }
  .muted { color: #9AA3C7; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Recharger mon portefeuille</h1>
  <div class="amount" id="amount">—</div>
  <p id="status">Paiement sécurisé par KKIAPAY (Mobile Money, carte).</p>
  <button id="pay" type="button">Payer maintenant</button>
  <p class="muted">Votre solde est crédité dès que KKIAPAY confirme le paiement à nos serveurs.</p>
</main>
<script src="https://cdn.kkiapay.me/k.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const deposit = q.get("deposit") || "";
  const amount = parseInt(q.get("amount") || "0", 10);
  const key = q.get("key") || "";
  const sandbox = q.get("sandbox") === "1";
  const statusEl = document.getElementById("status");
  const valid = /^[0-9a-f-]{36}$/i.test(deposit) && amount > 0 && key;
  document.getElementById("amount").textContent =
    valid ? amount.toLocaleString("fr-FR") + " FCFA" : "Lien invalide";
  const payBtn = document.getElementById("pay");
  payBtn.disabled = !valid;
  payBtn.addEventListener("click", () => {
    openKkiapayWidget({ amount, key, sandbox, partnerId: deposit, position: "center", theme: "#7C5CFF" });
  });
  addSuccessListener((response) => {
    const tx = encodeURIComponent(response.transactionId || "");
    statusEl.textContent = "Paiement reçu. Vous pouvez revenir dans l'application VYBORA.";
    payBtn.outerHTML = '<a class="btn" href="vybora://payment?deposit=' + deposit + '&transaction=' + tx + '">Revenir dans VYBORA</a>';
  });
</script>
</body>
</html>
